## Static Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and dashboard configuration  
api:
  dashboard: true
  insecure: true  # For production, set to false and use proper authentication

# Entry points (ports Traefik listens on)
entryPoints:
  web:
    address: ":80"
    # Optional: Redirect HTTP to HTTPS
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
  websecure:
    address: ":443"

# Providers tell Traefik where to look for configuration
providers:
  # Docker provider configuration
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-network
  
  # File provider for external services configuration
  file:
    directory: "/etc/traefik/dynamic"
    watch: true  # Reload when files change

# Optional: Configure logs
log:
  level: INFO  # DEBUG, INFO, WARN, ERROR
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
