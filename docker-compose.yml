version: '3'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  prefect-server:
    image: prefecthq/prefect:3.2.7-python3.11
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      - PREFECT_API_REDIS_URL=redis://redis:6379/0
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_BASIC_AUTH_ENABLED=true
      - PREFECT_SERVER_API_BASIC_AUTH_USERNAME=admin
      - PREFECT_SERVER_API_BASIC_AUTH_PASSWORD=admin
    ports:
      - "4200:4200"
    command: prefect server start
    volumes:
      - prefect-server-data:/root/.prefect

  prefect-agent:
    image: prefecthq/prefect:3.2.7-python3.11
    restart: always
    depends_on:
      - prefect-server
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    entrypoint: ["prefect", "agent", "start", "-q", "default"]
    volumes:
      - ./flows:/opt/prefect/flows
      - ./work-pool-config:/root/.prefect/work-pool

volumes:
  postgres-data:
  redis-data:
  prefect-server-data: