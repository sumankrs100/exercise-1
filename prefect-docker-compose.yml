version: '3.8'

services:
  apollo:
    image: prefecthq/prefect:2.14.5-python3.11
    restart: always
    ports:
      - "4200:4200"
    environment:
      - PREFECT_UI_SERVE_BASE=http://0.0.0.0:4200
      - PREFECT_API_URL=http://apollo:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      - PREFECT_SERVER_ANALYTICS_ENABLED=false
      # OIDC settings
      - PREFECT_UI_OIDC_ENABLED=true
      - PREFECT_UI_OIDC_CLIENT_ID=prefect-client
      - PREFECT_UI_OIDC_CLIENT_SECRET=your-client-secret-from-keycloak
      - PREFECT_UI_OIDC_AUTHORITY=https://your-keycloak-domain.com/auth/realms/your-realm
      - PREFECT_UI_OIDC_SCOPE=openid profile email roles
      - PREFECT_UI_OIDC_REDIRECT_URI=http://your-traefik-domain.com/auth-callback
    depends_on:
      - postgres
    command: prefect server start

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
