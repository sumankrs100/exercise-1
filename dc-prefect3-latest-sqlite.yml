version: '3.8'

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    ports:
      - "4200:4200"
    environment:
      # This is the URL that your browser will use to connect to the API
      # Change this to your server's actual IP address or hostname when accessing from other machines
      - PREFECT_UI_API_URL=http://localhost:4200/api
      # This is the URL that the server container will use internally
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      # SQLite database configuration
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////root/.prefect/prefect.db
      # Authentication settings
      - PREFECT_SERVER_AUTH_ENABLED=true
      - PREFECT_SERVER_AUTH_TYPE=basic
      # Admin user credentials
      - PREFECT_SERVER_AUTH_BASIC_ADMIN_USERNAME=admin
      - PREFECT_SERVER_AUTH_BASIC_ADMIN_PASSWORD=yourSecurePassword123
    volumes:
      - prefect-data:/root/.prefect
    command: ["prefect", "server", "start"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:4200/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - prefect-network

  prefect-agent:
    image: prefecthq/prefect:3-latest
    container_name: prefect-agent
    restart: always
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Authentication credentials for the agent
      - PREFECT_API_KEY=yourAgentApiKey123
    volumes:
      - prefect-data:/root/.prefect
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["prefect", "agent", "start", "-p", "default"]
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - prefect-network

volumes:
  prefect-data:
    name: prefect-data

networks:
  prefect-network:
    name: prefect-network
