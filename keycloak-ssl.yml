version: '3'

services:
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - keycloak-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    command: start
    volumes:
      - ./certs:/opt/keycloak/certs
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # SSL Configuration
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/certificate.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/private-key.pem
      KC_HTTPS_PORT: 8443
      
      # Optional - If you have a chain file with root and intermediate certificates
      KC_HTTPS_CERTIFICATE_CHAIN_FILE: /opt/keycloak/certs/chain.pem
    ports:
      - "8443:8443"
    depends_on:
      - postgres
    networks:
      - keycloak-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  keycloak-network:
    driver: bridge
